
<main class="font-monospace ">
  <br>
  <div class="container container">
    <div class="container">
        <div class="profile-grid">

          <aside class="profile-sidebar">
            <div class="avatar-wrap">

              <img id="profile-photo" src="/img/sem-foto.png" alt="Foto de perfil">
            </div>

            <div class="avatar-actions">
              <!-- <button type="button" id="change-photo" class="button button-secondary">Alterar foto</button>-->
              <input id="photo-input" type="file" accept="image/*" hidden>
            </div>

            <div class="profile-info-card">
              <div class="info-row"><span>Nome</span><strong id="profile-display-name">{{data.signalUserProfile().name}}</strong></div>
              <div class="info-row"><span>Cliente</span><strong>Desde {{data.signalUserProfile().entryDate}}</strong></div>
              <div class="container">
                <button class="button button-secondary">editar</button>
              </div>
            </div>

          </aside>

          <section class="profile-main">
            <div class=" row section-header">
              <div class="row">
                <div class="col">
                <h2>Movimentações</h2>
                </div>
                <div class="col">
                  <h2>{{ data.signalUserProfile().amount }} mupcoins</h2>
                </div>
              </div>
              <!-- <button type="button" class="button button-secondary">Ver detalhes</button>-->
            </div>
            <app-deposit-view></app-deposit-view>
            <div class="transaction-actions">
              <button type="button" class="button button-secondary" (click)="openDepositModal()">fazer transferência</button>

            </div>

            <!-- Serviços (status cards) colocados abaixo de Movimentações -->



          </section>
        </div>

        <!-- serviços movidos para dentro de Movimentações -->



      <app-deposit></app-deposit>

    </div>
  </div>
</main>
